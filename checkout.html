// API
async function sbGet(table, q) {
  q = q || '';
  var r = await fetch(SB_URL + '/rest/v1/' + table + q, { headers: SB_H });
  if (!r.ok) { var e = await r.text().catch(function(){return '';}); throw new Error('GET ' + table + ' ' + r.status + ': ' + e); }
  return r.json();
}
async function sbPost(table, data) {
  var r = await fetch(SB_URL + '/rest/v1/' + table, {
    method: 'POST', body: JSON.stringify(data),
    headers: Object.assign({}, SB_H, { 'Content-Type': 'application/json', 'Prefer': 'return=representation' })
  });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbRpc(fn, params) {
  var r = await fetch(SB_URL + '/rest/v1/rpc/' + fn, {
    method: 'POST', body: JSON.stringify(params || {}),
    headers: Object.assign({}, SB_H, { 'Content-Type': 'application/json' })
  });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
// ✅ إعادة محاولة تلقائية لطلبات إنشاء الطلب فقط — الشبكات الجزائرية
// (خصوصاً الموبايل) تنقطع أحياناً في نفس لحظة رجوع رد السيرفر، فتفشل
// عند الزبون رغم أن الطلب اتسجّل فعلاً عند السيرفر. نعيد المحاولة فقط
// عند خطأ شبكة/timeout حقيقي (لا عند خطأ تحقق من البيانات — إعادة
// المحاولة لن تغيّر نتيجته وسيرجع بنفس الخطأ فوراً).
async function sbRpcWithRetry(fn, params, maxRetries) {
  maxRetries = (typeof maxRetries === 'number') ? maxRetries : 2;
  var lastErr;
  for (var attempt = 0; attempt <= maxRetries; attempt++) {
    var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, 15000) : null;
    try {
      var r = await fetch(SB_URL + '/rest/v1/rpc/' + fn, {
        method: 'POST', body: JSON.stringify(params || {}),
        headers: Object.assign({}, SB_H, { 'Content-Type': 'application/json' }),
        signal: ctrl ? ctrl.signal : undefined
      });
      if (timer) clearTimeout(timer);
      if (r.ok) return await r.json();
      var bodyText = await r.text();
      if (r.status >= 500 && attempt < maxRetries) {
        lastErr = new Error(bodyText);
        await new Promise(function(res){ setTimeout(res, 1500*(attempt+1)); });
        continue;
      }
      throw new Error(bodyText);
    } catch(e) {
      if (timer) clearTimeout(timer);
      var isNetworkErr = e.name==='AbortError' || (e instanceof TypeError);
      if (isNetworkErr && attempt < maxRetries) {
        lastErr = e;
        await new Promise(function(res){ setTimeout(res, 1500*(attempt+1)); });
        continue;
      }
      throw e;
    }
  }
  throw lastErr;
}
async function sbUpsert(table, data) {
  var r = await fetch(SB_URL + '/rest/v1/' + table, {
    method: 'POST', body: JSON.stringify(data),
    headers: Object.assign({}, SB_H, { 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates,return=representation' })
  });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbPatch(table, filter, data) {
  var r = await fetch(SB_URL + '/rest/v1/' + table + '?' + filter, {
    method: 'PATCH', body: JSON.stringify(data),
    headers: Object.assign({}, SB_H, { 'Content-Type': 'application/json' })
  });
  if (!r.ok) throw new Error(await r.text());
  return true;
}
async function sbDelete(table, filter) {
  var r = await fetch(SB_URL + '/rest/v1/' + table + '?' + filter, { method: 'DELETE', headers: SB_H });
  if (!r.ok) throw new Error(await r.text());
  return true;
}
async function getSetting(key) {
  try { var r = await sbGet('settings', '?key=eq.' + key + '&select=value'); return r && r[0] ? r[0].value : null; }
  catch(e) { console.warn('getSetting', key, e.message); return null; }
}
async function setSetting(key, value) {
  return sbUpsert('settings', { key: key, value: value, updated_at: new Date().toISOString() });
}
async function uploadImg(file, bucket) {
  bucket = bucket || 'products';
  var ext = file.name.split('.').pop() || 'jpg';
  var name = Date.now() + '_' + Math.random().toString(36).slice(2) + '.' + ext;
  var r = await fetch(SB_URL + '/storage/v1/object/' + bucket + '/' + name, {
    method: 'POST',
    headers: { apikey: SB_ANON, Authorization: 'Bearer ' + SB_ANON, 'Content-Type': file.type },
    body: file
  });
  if (!r.ok) throw new Error('Upload failed ' + r.status + ': ' + (await r.text()));
  return SB_URL + '/storage/v1/object/public/' + bucket + '/' + name;
}

// Utils
function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function money(n) { return (Number(n)||0).toLocaleString('fr-DZ'); }
function compact(n) { n=Number(n)||0; if(n>=1e6) return (n/1e6).toFixed(1)+'M'; if(n>=1e3) return (n/1e3).toFixed(n%1e3?1:0)+'K'; return String(n); }
function toast(msg, dur) {
  dur = dur || 3000;
  var t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._t); t._t = setTimeout(function(){ t.style.display='none'; }, dur);
}

    document.getElementById('sumDel').textContent=isPickup?(fr?'Retrait':'استلام'):(selW?money(dc)+' دج':'—');
    var discRow=document.getElementById('sumDiscRow');
    if(appliedCoupon&&appliedDiscount>0){discRow.style.display='flex';document.getElementById('sumDisc').textContent='-'+money(appliedDiscount)+' دج';}
    else{discRow.style.display='none';}
    document.getElementById('sumTot').textContent=money(Math.max(subtotal-appliedDiscount,0))+' دج';
    return;
  }
  if(!prod) return;
  var pr=Number(prod.price)||0;
  var subtotal2=pr*qty+dc;
  var ln=fr&&prod.name_fr?prod.name_fr:(prod.name_ar||prod.name||'');
  document.getElementById('sumPname').textContent=ln+(color?' ('+color+')':'');
  document.getElementById('sumPrice').textContent=money(pr)+' دج';
  document.getElementById('sumQty').textContent='×'+qty;
  document.getElementById('sumDel').textContent=isPickup?(fr?'Retrait':'استلام'):(selW?money(dc)+' دج':'—');
  var discRow2=document.getElementById('sumDiscRow');
  if(appliedCoupon&&appliedDiscount>0){
    discRow2.style.display='flex';
    document.getElementById('sumDisc').textContent='-'+money(appliedDiscount)+' دج';
  } else { discRow2.style.display='none'; }
  document.getElementById('sumTot').textContent=money(Math.max(subtotal2-appliedDiscount,0))+' دج';
}

async function applyCoupon(){
  var code=document.getElementById('couponInput').value.trim();
  var msg=document.getElementById('couponMsg');
  if(!code){msg.style.color='#e74c3c';msg.textContent='⚠️ أدخلي كوداً';return;}
  if(!isCartMode&&!prod){return;}
  if(isCartMode&&!cartItems.length){return;}
  var isPickup=selPay==='pickup';
  var dc=getDeliveryCost();
  var subtotal=isCartMode?(cartSubtotal()+dc):((Number(prod.price)||0)*qty+dc);
  try{
    var r=await fetch(SB_URL+'/rest/v1/rpc/validate_coupon',{
      method:'POST',
      headers:Object.assign({},SB_H,{'Content-Type':'application/json'}),
      body:JSON.stringify({p_code:code,p_subtotal:subtotal})
    });
    var d=await r.json();
    if(d&&d.valid){
      appliedCoupon=code.toUpperCase();appliedDiscount=Number(d.discount)||0;
      msg.style.color='#27ae60';msg.textContent='✅ تم تطبيق الكود — خصم '+money(appliedDiscount)+' دج';
      updateSum();
    } else {
      appliedCoupon=null;appliedDiscount=0;
      var errMap={
        not_found:'الكود غير صحيح',inactive:'الكود غير مفعّل',exhausted:'انتهى الحد المسموح لهذا الكود',
        not_started:'الكود لم يبدأ بعد',expired:'انتهت صلاحية الكود',
        below_minimum:'الحد الأدنى للطلب '+(d&&d.min_order?money(d.min_order):'')+' دج'
      };
      msg.style.color='#e74c3c';msg.textContent='❌ '+(errMap[d&&d.error]||'الكود غير صالح');
      updateSum();
    }
  }catch(e){msg.style.color='#e74c3c';msg.textContent='❌ خطأ في التحقق';}
}

async function loadProd(){

function onWilaya(){

      openDeliveryContactPopup();

      updateSum();
    }
  });
  var cs=document.getElementById('iCommune');
  var communes = selW&&selW.communes ? selW.communes : [];
  // Handle both array and JSON string formats
  if(typeof communes === 'string'){try{communes=JSON.parse(communes);}catch(e){communes=[];}}
  if(communes && communes.length){
    var ch='<option value="">'+(LANG==='fr'?'Choisir...':'اختاري...')+'</option>';
    communes.forEach(function(cm){
      var cn=typeof cm==='string'?cm:(cm.name||cm);
      var isActive=typeof cm==='string'?true:(cm.active!==false);
      if(!isActive) return; // ✅ لا تُعرض بلدية معطّلة من الأدمن للزبون
      ch+='<option value="'+esc(cn)+'">'+esc(cn)+'</option>';
    });

// ✅ سعر التوصيل الحقيقي: سعر البلدية المخصص إن وُجد ومفعّل، وإلا سعر
// الولاية الافتراضي — نفس منطق resolve_delivery() في قاعدة البيانات،
// حتى يطابق الرقم المعروض للزبون الرقم الذي سيُحتسب فعلياً عند التأكيد.
function getDeliveryCost(){
  if(selPay==='pickup'||!selW) return 0;
  var commune=document.getElementById('iCommune')?document.getElementById('iCommune').value:'';
  var communes=selW.communes;
  if(typeof communes==='string'){try{communes=JSON.parse(communes);}catch(e){communes=[];}}
  communes=communes||[];
  if(commune){
    var c=communes.find(function(x){ return (typeof x==='string'?x:x.name)===commune; });
    if(c && typeof c==='object' && c.active!==false && c.home_price!==null && c.home_price!==undefined && c.home_price!==''){
      return Number(c.home_price)||0;
    }
  }
  return Number(selW.home_price||0);
}

// ✅ validation الهاتف الجزائري
function validatePhone(p){
  var clean=p.replace(/[\s\-\.]/g,'');
  return /^(0[5-7]\d{8}|213[5-7]\d{8}|\+213[5-7]\d{8})$/.test(clean);
}

var _submitting=false;
var CLIENT_REF=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():('cr'+Date.now()+Math.random().toString(36).slice(2));

async function submitOrder(){
  // ✅ منع الإرسال المزدوج — أول سطر
  if(_submitting)return;
  // Honeypot
  var hp=document.getElementById('hp_field');
  if(hp&&hp.value){toast('✅ تم إرسال طلبك');return;}
  var l=getL();
  var isPickup=selPay==='pickup';
  var name=document.getElementById('iName').value.trim();
  var rawPhone=document.getElementById('iPhone').value.trim();
  var phone=rawPhone.replace(/[\s\-\.]/g,''); // ✅ تنظيف الهاتف
  var phone2Raw=document.getElementById('iPhone2')?document.getElementById('iPhone2').value.trim():'';
  var phone2=phone2Raw.replace(/[\s\-\.]/g,'');
  var schedDate=document.getElementById('iDate')?document.getElementById('iDate').value:'';
  var schedTime=document.getElementById('iTime')?document.getElementById('iTime').value:'';
  var wSel=document.getElementById('iWilaya');
  var wid=(!isPickup&&wSel.value)?parseInt(wSel.value):null;
  var commune=document.getElementById('iCommune').value;
  var addr=document.getElementById('iAddr').value.trim();
  var note=document.getElementById('iNote').value.trim();
  var email=document.getElementById('iEmail').value.trim().toLowerCase();
  var isGift=document.getElementById('iIsGift').checked;
  var giftPhoneRaw=document.getElementById('iGiftPhone').value.trim();
  var giftPhone=giftPhoneRaw.replace(/[\s\-\.]/g,'');
  if(!name){ toast(l.nameErr); return; }
  if(!phone||!validatePhone(rawPhone)){ toast(l.phoneErr+' — مثال: 0555 123 456'); return; }
  if(phone2Raw&&!validatePhone(phone2Raw)){ toast(l.phoneErr+' (الرقم الاحتياطي) — مثال: 0555 123 456'); return; }
  if(!isPickup&&(!selW||!wid)){ toast(l.wilayaErr); return; }
  if(isGift&&(!giftPhone||!validatePhone(giftPhoneRaw))){ toast(l.giftPhoneErr+' — مثال: 0555 123 456'); return; }
  if(isCartMode){ if(!cartItems.length){ toast('⚠️'); return; } }
  else if(!prod){ toast('⚠️'); return; }
  // ✅ تحقق البريد إذا أُدخل
  if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){toast('⚠️ البريد الإلكتروني غير صحيح');return;}
  // Rate limit: max 3 orders per 10 min
  try{
    var rl=JSON.parse(localStorage.getItem('fl_rl')||'[]');
    var now10=Date.now()-10*60*1000;
    rl=rl.filter(function(t){return t>now10;});
    if(rl.length>=3){toast('⚠️ انتظري قليلاً قبل إرسال طلب آخر');return;}
    rl.push(Date.now());
    localStorage.setItem('fl_rl',JSON.stringify(rl));
  }catch(e){}
  _submitting=true;
  var btn=document.getElementById('subBtn');
  btn.disabled=true; btn.textContent=l.sending;
  var oid='FBL'+Date.now();
  var saved;
  try{
    // ✅ عند تفعيل "هدية" نستعمل نفس حقل الملاحظة كرسالة الهدية (تُحفظ في
    // عمود gift_message المنفصل)، بدل تكرار نفس الحقل مرتين في الواجهة
    var giftMsg=isGift?(note||null):null;
    var noteToSend=isGift?'':note;
    if(isCartMode){
      var cartParams={
        p_id:oid, p_items:cartItems.map(function(it){return {product_id:it.product_id,qty:it.qty};}),
        p_name:name, p_phone:phone, p_wilaya_id:wid, p_commune:isPickup?'':commune, p_address:isPickup?'':addr,
        p_payment_method:selPay, p_fulfillment_type:isPickup?'pickup':'delivery',
        p_note:noteToSend, p_lang:LANG, p_email:email||null,
        p_coupon_code:appliedCoupon||null, p_client_ref:CLIENT_REF,
        p_is_gift:isGift, p_gift_sender_phone:isGift?giftPhone:null, p_gift_message:giftMsg,
        p_scheduled_date:schedDate||null, p_scheduled_time:schedTime||null, p_phone2:phone2||null
      };
      saved=await sbRpcWithRetry('create_cart_order',cartParams);
      try{localStorage.setItem('fl_cart','[]');}catch(e){}
    } else {
      var orderParams={
        p_id:oid, p_name:name, p_phone:phone, p_wilaya_id:wid, p_commune:isPickup?'':commune, p_address:isPickup?'':addr,
        p_product_id:prod.id, p_color:color, p_qty:qty,
        p_payment_method:selPay, p_fulfillment_type:isPickup?'pickup':'delivery',
        p_note:noteToSend, p_lang:LANG,
        p_email:email||null, // ✅ البريد في الطلب
        p_coupon_code:appliedCoupon||null, // ✅ السيرفر يعيد التحقق والتطبيق — لا يُوثق الخصم المعروض هنا
        p_client_ref:CLIENT_REF, // ✅ يمنع الطلبات المكررة عند النقر المتعدد
        p_is_gift:isGift, p_gift_sender_phone:isGift?giftPhone:null, p_gift_message:giftMsg,
        p_scheduled_date:schedDate||null, p_scheduled_time:schedTime||null, p_phone2:phone2||null
      };
      // ✅ نحفظ الطلب عبر RPC آمن — السيرفر (trigger) يعيد حساب السعر/التوصيل/الدفعة المقدمة/الحالة من مصدر موثوق
      saved=await sbRpcWithRetry('create_order',orderParams);
    }
    var real=(saved&&saved[0])?saved[0]:{};
    real.product_name=isCartMode?((real.item_count||cartItems.length)+(LANG==='fr'?' produits':' منتجات')):(LANG==='fr'&&prod.name_fr?prod.name_fr:(prod.name_ar||prod.name||''));
    real.product_emoji=isCartMode?'🛍️':(prod.emoji||'🌹');
    real.name=name; real.phone=phone; real.commune=isPickup?'':commune; real.address=isPickup?'':addr;
    real.payment_method=selPay; real.email=email||null;
    var receiptToken=real.receipt_token||'';

    // ✅ Telegram — مع receipt_token للتحقق من الملكية. ننتظر الإرسال (مع
    // محاولة واحدة إضافية عند فشل الشبكة) قبل الانتقال لصفحة التأكيد،
    // حتى لا يغادر المتصفح الصفحة قبل أن تصل الإشعار فعلياً للمتجر
    async function notifyTelegram(){
      for(var i=0;i<2;i++){
        try{
          await fetch(SB_URL+'/functions/v1/hyper-action',{
            method:'POST',
            headers:{'Content-Type':'application/json','apikey':SB_ANON,'Authorization':'Bearer '+SB_ANON},
            body:JSON.stringify({action:'telegram_notify',order:real,token:receiptToken})
          });
          return;
        }catch(e){ if(i===0) await new Promise(function(res){setTimeout(res,1000);}); }
      }
    }
    await notifyTelegram();

    // ✅ إيميل تأكيد — إذا الزبون عنده بريد
    if(email){
      fetch(SB_URL+'/functions/v1/hyper-action',{
        method:'POST',
        headers:{'Content-Type':'application/json','apikey':SB_ANON,'Authorization':'Bearer '+SB_ANON},
        body:JSON.stringify({
          action:'send_email',
          type:'order_confirm',
          order:real
        })
      }).catch(function(){});
    }

    // ✅ redirect حسب طريقة الدفع — كل الطرق المتبقية (pickup + التحويلات
    // البنكية) تحتاج رفع إيصال، فهذا هو المسار الوحيد الممكن الآن
    location.href='receipt.html?order='+encodeURIComponent(real.id)+'&lang='+LANG+(receiptToken?'&token='+receiptToken:'');
  }catch(e){
    var msg=String(e.message||'');
    if(msg.indexOf('client_ref')!==-1||msg.indexOf('duplicate')!==-1){
      // ✅ "مكرر" هنا لا يعني بالضرورة أن الزبون ضغط مرتين — قد يكون طلبها
      // الأول نجح فعلاً عند السيرفر لكن الرد ضاع بسبب انقطاع الشبكة (شائع
      // مع الإنترنت الجزائري)، فتحاول محاولة sbRpcWithRetry مرة أخرى
      // وتصطدم بنفس client_ref. نحاول استرجاع الطلب الحقيقي بدل ترك
      // الزبونة بلا أي تأكيد لطلب رُسل فعلاً
      try{
        var recovered=await sbRpc('get_order_by_client_ref',{p_client_ref:CLIENT_REF});
        var ro=(recovered&&recovered[0])?recovered[0]:null;
        if(ro){
          location.href='receipt.html?order='+encodeURIComponent(ro.id)+'&lang='+LANG+(ro.receipt_token?'&token='+ro.receipt_token:'');
          return;
        }
      }catch(e2){}
      toast(LANG==='fr'?'⚠️ Cette commande a déjà été envoyée':'⚠️ هذا الطلب أُرسل مسبقاً — لا تكرري الإرسال');
      return; // ✅ نبقي الزر معطّل — لا نسمح بإعادة محاولة لنفس الطلب
    }
    toast('❌ '+msg);
    _submitting=false;
    btn.disabled=false; btn.textContent=l.subBtn;
  }
}

async function init(){
  applyLang();
  await loadFeatureFlags();
  await loadProd();
  loadWilayas();
  loadPay();
}
init();
</script>
