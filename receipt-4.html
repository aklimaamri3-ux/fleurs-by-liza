<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fleurs by Liza — رفع الإيصال</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--pk:#e91e8c;--pkp:#fce4f3;--blk:#111;--mt:#888;--bd:rgba(0,0,0,.08);--gn:#27ae60;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Tajawal',sans-serif;color:#1a1a2e;background:#fafafa;}
button,input{font-family:inherit;cursor:pointer;}
input{cursor:text;}

header{display:flex;align-items:center;padding:1rem 1.5rem;border-bottom:1px solid var(--bd);background:#fff;gap:1rem;}
.back-btn{font-size:1.3rem;}
.logo{font-family:'Montserrat',sans-serif;font-weight:800;font-size:1.1rem;}
.logo span{color:var(--pk);}

.wrap{padding:1.5rem;max-width:480px;margin:0 auto;}

/* Stepper — RTL correct order: 1 starts from the right */
.steps-bar{display:flex;align-items:center;justify-content:center;gap:0;margin-bottom:2rem;direction:ltr;}
.step-item{display:flex;flex-direction:column;align-items:center;gap:.3rem;flex:1;position:relative;}
.step-item:not(:last-child)::after{content:'';position:absolute;top:16px;right:-50%;width:100%;height:2px;background:var(--bd);z-index:0;}
.step-item.done:not(:last-child)::after{background:var(--pk);}
.step-num{width:32px;height:32px;border-radius:50%;background:#eee;color:#999;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;z-index:1;}
.step-item.active .step-num{background:var(--pk);color:#fff;}
.step-item.done .step-num{background:var(--gn);color:#fff;}
.step-lbl{font-size:.7rem;color:#999;}
.step-item.active .step-lbl{color:var(--pk);font-weight:700;}

.card{background:#fff;border-radius:1rem;padding:1.5rem;}
.title{text-align:center;font-family:'Montserrat',sans-serif;font-weight:800;font-size:1.2rem;margin-bottom:.4rem;}
.subtitle{text-align:center;color:var(--mt);font-size:.82rem;margin-bottom:1.5rem;line-height:1.6;}

.fi{width:100%;padding:.8rem 1rem;border:1.5px solid var(--bd);border-radius:.8rem;font-size:.9rem;margin-bottom:1rem;}
.fi:focus{outline:none;border-color:var(--pk);}
.btn{width:100%;background:var(--pk);color:#fff;padding:.9rem;border-radius:2rem;font-weight:700;font-size:.92rem;border:none;}

.order-info{background:var(--pkp);border-radius:.8rem;padding:1rem;margin-bottom:1.2rem;font-size:.85rem;}
.order-info b{font-family:'Montserrat',sans-serif;}

.upload-zone{border:2px dashed var(--bd);border-radius:1rem;padding:2rem 1rem;text-align:center;cursor:pointer;transition:.2s;margin-bottom:1rem;}
.upload-zone.drag{border-color:var(--pk);background:var(--pkp);}
.upload-zone .icon{font-size:2.5rem;margin-bottom:.6rem;}
.upload-zone p{font-size:.82rem;color:var(--mt);}
.preview-img{width:100%;border-radius:.8rem;margin-bottom:1rem;}

.success-box{text-align:center;padding:2rem 0;}
.success-emoji{font-size:3.5rem;margin-bottom:1rem;}

#toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:var(--blk);color:#fff;padding:.7rem 1.4rem;border-radius:2rem;font-size:.82rem;display:none;z-index:1000;}
.hide{display:none !important;}
</style>
</head>
<body>

<header>
  <a href="index.html" class="back-btn">→</a>
  <div class="logo">Fleur<span>❀</span>by liza</div>
</header>

<div class="wrap">
  <div class="steps-bar">
    <div class="step-item" id="step3"><div class="step-num">3</div><div class="step-lbl">التأكيد</div></div>
    <div class="step-item" id="step2"><div class="step-num">2</div><div class="step-lbl">الإيصال</div></div>
    <div class="step-item active" id="step1"><div class="step-num">1</div><div class="step-lbl">الطلب</div></div>
  </div>

  <!-- PANEL 1: find order -->
  <div class="card" id="panel1">
    <div class="title">أرسلي إيصالك 🌹</div>
    <div class="subtitle">بعد إتمام التحويل البنكي، ارفعي صورة الإيصال هنا ليتم تأكيد دفعك وتجهيز طلبك</div>
    <input class="fi" id="orderIdInput" placeholder="FBL-XXXXXXX (رقم الطلب)">
    <button class="btn" onclick="findOrder()">🔍 بحث</button>
  </div>

  <!-- PANEL 2: upload -->
  <div class="card hide" id="panel2">
    <div class="title">رفع الإيصال</div>
    <div class="order-info" id="orderInfo"></div>
    <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
      <div class="icon">📤</div>
      <p>اضغطي لاختيار صورة الإيصال<br>أو اسحبيها هنا</p>
      <input type="file" id="fileInput" accept="image/*" style="display:none;" onchange="onFileSelected(this.files[0])">
    </div>
    <img id="previewImg" class="preview-img hide">
    <button class="btn" id="uploadBtn" onclick="uploadReceipt()" disabled>📤 رفع الإيصال</button>
  </div>

  <!-- PANEL 3: success -->
  <div class="card hide" id="panel3">
    <div class="success-box">
      <div class="success-emoji">✅</div>
      <div class="title">تم استلام الإيصال!</div>
      <div class="subtitle">سنراجع دفعتك ونؤكد طلبك قريباً 🌹<br>سيصلك إشعار عبر واتساب أو الهاتف</div>
      <a href="index.html" class="btn" style="display:block;text-decoration:none;box-sizing:border-box;">العودة للرئيسية</a>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ═══════════════════════════════════════
// Fleurs by Liza — Shared Config
// ═══════════════════════════════════════
const SB_URL = 'https://ogtyvzqmifhkdoetumag.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ndHl2enFtaWZoa2RvZXR1bWFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMzk1MDcsImV4cCI6MjA5NDYxNTUwN30.203q3w-EmneSP81Ecz9oc1DKLycrfIMU6iraKwng8wM';
const SB_HEADERS = { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY };

async function sbGet(table, query) {
  query = query || '';
  const res = await fetch(SB_URL + '/rest/v1/' + table + query, { headers: SB_HEADERS });
  if (!res.ok) {
    const txt = await res.text().catch(function(){ return ''; });
    throw new Error('GET ' + table + ' failed: ' + res.status + ' ' + txt);
  }
  return res.json();
}

async function sbPost(table, data) {
  const headers = Object.assign({}, SB_HEADERS, {
    'Content-Type': 'application/json',
    'Prefer': 'return=representation'
  });
  const res = await fetch(SB_URL + '/rest/v1/' + table, {
    method: 'POST', headers: headers, body: JSON.stringify(data)
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

async function sbUpsert(table, data) {
  const headers = Object.assign({}, SB_HEADERS, {
    'Content-Type': 'application/json',
    'Prefer': 'resolution=merge-duplicates,return=representation'
  });
  const res = await fetch(SB_URL + '/rest/v1/' + table, {
    method: 'POST', headers: headers, body: JSON.stringify(data)
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

async function sbPatch(table, filter, data) {
  const headers = Object.assign({}, SB_HEADERS, { 'Content-Type': 'application/json' });
  const res = await fetch(SB_URL + '/rest/v1/' + table + '?' + filter, {
    method: 'PATCH', headers: headers, body: JSON.stringify(data)
  });
  if (!res.ok) throw new Error(await res.text());
  return true;
}

async function sbDelete(table, filter) {
  const res = await fetch(SB_URL + '/rest/v1/' + table + '?' + filter, {
    method: 'DELETE', headers: SB_HEADERS
  });
  if (!res.ok) throw new Error(await res.text());
  return true;
}

async function getSetting(key) {
  try {
    const rows = await sbGet('settings', '?key=eq.' + key + '&select=value');
    return rows && rows[0] ? rows[0].value : null;
  } catch (e) {
    console.error('getSetting(' + key + ') failed:', e);
    return null;
  }
}

async function setSetting(key, value) {
  return sbUpsert('settings', { key: key, value: value, updated_at: new Date().toISOString() });
}

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function fmtPrice(n) {
  n = Number(n) || 0;
  return n.toLocaleString('en-US');
}

function fmtCompact(n) {
  n = Number(n) || 0;
  if (n >= 1000) return (n/1000).toFixed(n%1000===0?0:1) + 'K';
  return String(n);
}

</script>
<script>
var currentOrder = null;
var selectedFile = null;
var BUCKET = 'receipts';

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(function(){ t.style.display = 'none'; }, 3000);
}

function setStep(n) {
  [1,2,3].forEach(function(i){
    var el = document.getElementById('step' + i);
    el.classList.remove('active','done');
    if (i < n) el.classList.add('done');
    if (i === n) el.classList.add('active');
  });
}

async function findOrder() {
  var id = document.getElementById('orderIdInput').value.trim();
  if (!id) { showToast('⚠️ أدخلي رقم الطلب'); return; }
  try {
    var rows = await sbGet('orders', '?id=eq.' + encodeURIComponent(id) + '&limit=1');
    if (!rows || !rows.length) { showToast('❌ لم يتم العثور على هذا الطلب'); return; }
    currentOrder = rows[0];

    if (currentOrder.payment_status === 'paid') {
      document.getElementById('panel1').classList.add('hide');
      document.getElementById('panel3').classList.remove('hide');
      setStep(3);
      return;
    }

    document.getElementById('orderInfo').innerHTML =
      '<div>الطلب: <b>#' + escapeHtml(currentOrder.id) + '</b></div>' +
      '<div>المنتج: ' + escapeHtml(currentOrder.product||'') + '</div>' +
      '<div>المبلغ: <b>' + fmtPrice(currentOrder.total) + ' دج</b></div>';

    document.getElementById('panel1').classList.add('hide');
    document.getElementById('panel2').classList.remove('hide');
    setStep(2);
  } catch (e) {
    console.error('findOrder failed:', e);
    showToast('❌ خطأ في البحث: ' + e.message);
  }
}

function onFileSelected(file) {
  if (!file) return;
  if (!file.type.startsWith('image/')) { showToast('⚠️ الرجاء اختيار صورة'); return; }
  if (file.size > 3 * 1024 * 1024) { showToast('⚠️ حجم الصورة كبير جداً (الحد الأقصى 3MB)'); return; }
  selectedFile = file;
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = document.getElementById('previewImg');
    img.src = e.target.result;
    img.classList.remove('hide');
    document.getElementById('uploadBtn').disabled = false;
  };
  reader.readAsDataURL(file);
}

var uploadZone = document.getElementById('uploadZone');
uploadZone.addEventListener('dragover', function(e){ e.preventDefault(); uploadZone.classList.add('drag'); });
uploadZone.addEventListener('dragleave', function(){ uploadZone.classList.remove('drag'); });
uploadZone.addEventListener('drop', function(e){
  e.preventDefault();
  uploadZone.classList.remove('drag');
  if (e.dataTransfer.files.length) onFileSelected(e.dataTransfer.files[0]);
});

async function uploadReceipt() {
  if (!selectedFile || !currentOrder) return;
  var btn = document.getElementById('uploadBtn');
  btn.disabled = true;
  btn.textContent = '⏳ جاري الرفع...';

  try {
    var ext = selectedFile.name.split('.').pop() || 'jpg';
    var fileName = currentOrder.id + '_' + Date.now() + '.' + ext;

    var uploadRes = await fetch(SB_URL + '/storage/v1/object/' + BUCKET + '/' + fileName, {
      method: 'POST',
      headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': selectedFile.type },
      body: selectedFile
    });

    if (!uploadRes.ok) {
      var errText = await uploadRes.text().catch(function(){ return ''; });
      throw new Error('فشل الرفع: ' + uploadRes.status + ' ' + errText);
    }

    var receiptUrl = SB_URL + '/storage/v1/object/public/' + BUCKET + '/' + fileName;

    await sbPatch('orders', 'id=eq.' + encodeURIComponent(currentOrder.id), {
      receipt_url: receiptUrl,
      payment_status: 'waiting_review',
      receipt_uploaded_at: new Date().toISOString()
    });

    document.getElementById('panel2').classList.add('hide');
    document.getElementById('panel3').classList.remove('hide');
    setStep(3);

  } catch (e) {
    console.error('uploadReceipt failed:', e);
    showToast('❌ ' + e.message);
    btn.disabled = false;
    btn.textContent = '📤 رفع الإيصال';
  }
}

// Auto-fill order ID from URL param
(function(){
  var params = new URLSearchParams(window.location.search);
  var orderParam = params.get('order');
  if (orderParam) {
    document.getElementById('orderIdInput').value = orderParam;
    findOrder();
  }
})();
</script>
</body>
</html>
