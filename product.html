<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https://*.supabase.co data: blob:; connect-src 'self' https://*.supabase.co; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'">

<title>Fleurs by Liza</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--pk:#c8963c;--pk2:#e91e8c;--pkp:#fce4f3;--pkl:#f8bbd0;--blk:#0d0d0d;--wh:#fff;--bd:rgba(0,0,0,.08);--mt:#888;--card-r:1.1rem;--font-ar:'Tajawal',sans-serif;--font-en:'Inter',sans-serif;--font-serif:'Cormorant Garamond',serif;}
*{margin:0;padding:0;box-sizing:border-box;}body{font-family:var(--font-ar);color:#1a1a1a;}
img{max-width:100%;display:block;}a{text-decoration:none;color:inherit;}button{font-family:inherit;cursor:pointer;border:none;}
header{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.5rem;border-bottom:1px solid var(--bd);background:rgba(255,255,255,.95);backdrop-filter:blur(12px);position:sticky;top:0;z-index:100;}
.back{width:38px;height:38px;border-radius:50%;background:var(--pkp);display:flex;align-items:center;justify-content:center;font-size:1.1rem;}
.logo{font-family:var(--font-serif);font-size:1.3rem;font-weight:600;}.logo em{color:var(--pk);font-style:italic;}
.gal{position:relative;background:#f8f8f8;overflow:hidden;user-select:none;}
.gal-main{aspect-ratio:1;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;background:#f8f8f8;}
.gal-main img{width:100%;height:100%;object-fit:cover;transition:transform .35s ease;}
.gal-main .emo{font-size:6rem;}
.gal-badge{position:absolute;top:.9rem;right:.9rem;background:var(--pk2);color:#fff;font-size:.65rem;font-weight:700;padding:.25rem .7rem;border-radius:1rem;letter-spacing:.04em;z-index:2;}
.gal-thumbs{display:flex;gap:.45rem;padding:.65rem .9rem;overflow-x:auto;scrollbar-width:none;}
.gal-thumbs::-webkit-scrollbar{display:none;}
.gth{width:62px;height:62px;border-radius:.5rem;object-fit:cover;cursor:pointer;border:2.5px solid transparent;transition:.2s;flex-shrink:0;background:var(--pkp);display:flex;align-items:center;justify-content:center;font-size:1.4rem;}
.gth.active{border-color:var(--pk2);}
.gth img{width:100%;height:100%;object-fit:cover;border-radius:.3rem;}
.content{padding:1.5rem;}
.pname{font-family:var(--font-serif);font-weight:400;font-size:1.7rem;line-height:1.3;margin-bottom:.5rem;}
.pdesc{color:var(--mt);font-size:.84rem;line-height:1.8;margin-bottom:1.2rem;}
.price-row{display:flex;align-items:baseline;gap:.6rem;margin-bottom:.2rem;}
.pmain{font-family:var(--font-en);font-weight:700;font-size:1.7rem;color:var(--pk2);}
.pold{font-family:var(--font-en);text-decoration:line-through;color:var(--mt);font-size:1rem;}
.peur{font-size:.75rem;color:var(--mt);margin-bottom:1.3rem;}
.opt-block{margin-bottom:1.3rem;}
.opt-lbl{font-weight:700;font-size:.83rem;margin-bottom:.65rem;}
.clr-opts{display:flex;gap:.6rem;flex-wrap:wrap;}
.clr-dot{width:34px;height:34px;border-radius:50%;border:2.5px solid var(--bd);cursor:pointer;transition:.2s;}
.clr-dot.sel{border-color:var(--pk2);box-shadow:0 0 0 3px var(--pkl);}
.qty-row{display:flex;align-items:center;}
.qbox{display:flex;align-items:center;border:1.5px solid var(--bd);border-radius:3rem;overflow:hidden;}
.qbtn{width:42px;height:42px;background:var(--pkp);font-size:1.1rem;display:flex;align-items:center;justify-content:center;color:var(--pk2);font-weight:700;}
.qnum{width:48px;text-align:center;font-weight:700;font-family:var(--font-en);}
.total-box{background:linear-gradient(135deg,var(--pkp),#fff);border:1px solid var(--pkl);border-radius:var(--card-r);padding:1.1rem 1.3rem;margin:1.3rem 0;}
.trow{display:flex;justify-content:space-between;font-size:.84rem;margin-bottom:.32rem;}
.trow b{font-family:var(--font-en);}
.trow.fin{font-weight:800;font-size:1.05rem;color:var(--pk2);border-top:1px solid var(--bd);padding-top:.5rem;margin-top:.4rem;}
.order-btn{width:100%;background:linear-gradient(135deg,var(--pk2),#8e24aa);color:#fff;padding:1.05rem;border-radius:3rem;font-weight:700;font-size:.95rem;box-shadow:0 14px 30px rgba(233,30,140,.3);}
.trust{display:flex;gap:.7rem;margin-top:1.3rem;justify-content:center;flex-wrap:wrap;}
.trust-it{text-align:center;font-size:.68rem;color:var(--mt);}
.trust-it .ico{font-size:1.3rem;display:block;margin-bottom:.2rem;}
#ld{position:fixed;inset:0;background:#fff;z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1rem;transition:opacity .3s;}
#ld.h{opacity:0;pointer-events:none;}
.ll{font-family:var(--font-serif);font-size:1.5rem;}.ll em{color:var(--pk);font-style:italic;}
#toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:var(--blk);color:#fff;padding:.7rem 1.4rem;border-radius:2rem;font-size:.8rem;display:none;z-index:1000;}
#zoomOv{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9000;display:none;align-items:center;justify-content:center;cursor:zoom-out;}
#zoomOv.sh{display:flex;}
#zoomOv img{max-width:95vw;max-height:95vh;object-fit:contain;border-radius:.5rem;}
.share-row{display:flex;gap:.6rem;margin-top:1rem;}
.share-btn{flex:1;padding:.55rem;border-radius:.7rem;font-size:.78rem;font-weight:600;text-align:center;cursor:pointer;border:1.5px solid var(--bd);}
.share-wa{background:#25d366;color:#fff;border-color:#25d366;}
.share-fb{background:#1877f2;color:#fff;border-color:#1877f2;}
.share-copy{background:var(--pkp);color:var(--pk2);border-color:var(--pkl);}
.social-proof{background:var(--pkp);border-radius:.7rem;padding:.5rem .8rem;font-size:.75rem;color:var(--pk2);margin-bottom:.8rem;display:flex;align-items:center;gap:.4rem;}
.recently-viewed{padding:1rem 1.5rem;border-top:1px solid var(--bd);}
.rv-title{font-weight:700;font-size:.82rem;margin-bottom:.7rem;}
.rv-grid{display:flex;gap:.7rem;overflow-x:auto;padding-bottom:.3rem;}
.rv-card{min-width:90px;border:1px solid var(--bd);border-radius:.7rem;overflow:hidden;cursor:pointer;flex-shrink:0;}
.rv-card img,.rv-card .rv-emo{width:90px;height:90px;object-fit:cover;}
.rv-card .rv-emo{display:flex;align-items:center;justify-content:center;font-size:2rem;background:var(--pkp);}
.rv-name{font-size:.68rem;padding:.3rem .4rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.skel{background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);background-size:200% 100%;animation:skel 1.4s infinite;}
@keyframes skel{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skel-img{width:100%;aspect-ratio:1;border-radius:.5rem;}
.skel-line{height:1rem;border-radius:.4rem;margin-bottom:.4rem;}
.skel-line.w80{width:80%}.skel-line.w60{width:60%}.skel-line.w40{width:40%}
</style>
</head>
<body>
<div id="ld"><div class="ll">Fleurs<em>❀</em>by liza</div></div>
<header>
  <a href="index.html" class="back">→</a>
  <div class="logo">Fleurs<em>❀</em>by liza</div>
  <div style="width:38px"></div>
</header>
<div style="padding:.5rem 1.5rem;font-size:.72rem;color:var(--mt);display:flex;align-items:center;gap:.35rem;background:#fafafa;border-bottom:1px solid var(--bd)">
  <a href="index.html" style="color:var(--mt);text-decoration:none">🏠 الرئيسية</a>
  <span>›</span>
  <span id="breadCat" style="color:var(--mt)">منتجات</span>
  <span id="breadSep" style="display:none">›</span>
  <span id="breadName" style="color:var(--pk2);font-weight:600;display:none"></span>
</div>
<div class="gal" id="gal">
  <div class="gal-main" id="galMain" onclick="openZoom()"><div class="emo">🌹</div></div>
  <div class="gal-thumbs" id="galThumbs"></div>
</div>
<div class="content">
  <div class="pname" id="pName">جاري التحميل...</div>
  <div class="pdesc" id="pDesc"></div>
  <div class="price-row"><span class="pmain" id="pPrice">—</span><span class="pold" id="pOld"></span></div>
  <div class="peur" id="pEur"></div>
  <div class="opt-block" id="clrBlock" style="display:none">
    <div class="opt-lbl" id="clrLbl">🎨 اللون: <span id="selClrName"></span></div>
    <div class="clr-opts" id="clrOpts"></div>
  </div>
  <div class="opt-block">
    <div class="opt-lbl" id="qtyLbl">الكمية</div>
    <div class="qty-row">
      <div class="qbox">
        <button class="qbtn" onclick="chQty(-1)">−</button>
        <span class="qnum" id="qNum">1</span>
        <button class="qbtn" onclick="chQty(1)">+</button>
      </div>
    </div>
  </div>
  <div class="total-box">
    <div class="trow"><span id="priceLabel">السعر</span><span><b id="tPrice">—</b></span></div>
    <div class="trow fin"><span id="totalLabel">المجموع</span><span><b id="tTotal">—</b></span></div>
  </div>
  <button class="order-btn" id="orderBtn" onclick="goCheckout()">🛒 إتمام الطلب</button>
<div class="share-row">
  <button class="share-btn share-wa" onclick="shareWA()">💬 واتساب</button>
  <button class="share-btn share-fb" onclick="shareFB()">📘 فيسبوك</button>
  <button class="share-btn share-copy" onclick="shareProduct()">🔗 نسخ الرابط</button>
</div>
  <div class="trust">
    <div class="trust-it"><span class="ico">🌿</span><span id="tr1">ورد طازج</span></div>
    <div class="trust-it"><span class="ico">🎁</span><span id="tr2">تغليف فاخر</span></div>
    <div class="trust-it"><span class="ico">🚚</span><span id="tr3">توصيل سريع</span></div>
    <div class="trust-it"><span class="ico">💳</span><span id="tr4">دفع آمن</span></div>
  </div>
</div>
<div id="toast"></div>
<div id="zoomOv" onclick="this.classList.remove('sh')"><img id="zoomImg" src=""></div>
<div class="recently-viewed" id="rvSection" style="display:none">
  <div class="rv-title">👁️ شفتيهم مسبقاً</div>
  <div class="rv-grid" id="rvGrid"></div>
</div>
<script>
// ═══ FLEURS BY LIZA — CORE ═══
var SB_URL  = "https://lgpllhbabctsdplqapzi.supabase.co";
var SB_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxncGxsaGJhYmN0c2RwbHFhcHppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMxNzE3NzEsImV4cCI6MjA5ODc0Nzc3MX0.1n9iBt0G-JaiHYRpx_Cp_csCiUYQVZcQJXc5SO86Eec";
// service role not needed in client files
var SB_H = { apikey: SB_ANON, Authorization: 'Bearer ' + SB_ANON };

// Language
var LANG = localStorage.getItem('flz_lang') || 'ar';
function t(ar, fr) { return LANG === 'fr' ? (fr || ar) : ar; }
function setLang(l) { LANG = l; localStorage.setItem('flz_lang', l); location.reload(); }

// API
async function sbGet(table, q) {
  q = q || '';
  var r = await fetch(SB_URL + '/rest/v1/' + table + q, { headers: SB_H });
  if (!r.ok) { var e = await r.text().catch(function(){return '';}); throw new Error('GET ' + table + ' ' + r.status + ': ' + e); }
  return r.json();
}
async function sbPost(table, data) {
  var r = await fetch(SB_URL + '/rest/v1/' + table, {
    method: 'POST', body: JSON.stringify(data),
    headers: Object.assign({}, SB_H, { 'Content-Type': 'application/json', 'Prefer': 'return=representation' })
  });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbUpsert(table, data) {
  var r = await fetch(SB_URL + '/rest/v1/' + table, {
    method: 'POST', body: JSON.stringify(data),
    headers: Object.assign({}, SB_H, { 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates,return=representation' })
  });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbPatch(table, filter, data) {
  var r = await fetch(SB_URL + '/rest/v1/' + table + '?' + filter, {
    method: 'PATCH', body: JSON.stringify(data),
    headers: Object.assign({}, SB_H, { 'Content-Type': 'application/json' })
  });
  if (!r.ok) throw new Error(await r.text());
  return true;
}
async function sbDelete(table, filter) {
  var r = await fetch(SB_URL + '/rest/v1/' + table + '?' + filter, { method: 'DELETE', headers: SB_H });
  if (!r.ok) throw new Error(await r.text());
  return true;
}
async function sbRpc(fn,params){var r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',body:JSON.stringify(params||{}),headers:Object.assign({},SB_H,{'Content-Type':'application/json'})});if(!r.ok)throw new Error(await r.text());return r.json();}
async function getSetting(key){try{return await sbRpc('get_public_setting',{k:key})||null;}catch(e){return null;}}
async function setSetting(key, value) {
  return sbUpsert('settings', { key: key, value: value, updated_at: new Date().toISOString() });
}
async function uploadImg(file, bucket) {
  bucket = bucket || 'products';
  var ext = file.name.split('.').pop() || 'jpg';
  var name = Date.now() + '_' + Math.random().toString(36).slice(2) + '.' + ext;
  var r = await fetch(SB_URL + '/storage/v1/object/' + bucket + '/' + name, {
    method: 'POST',
    headers: { apikey: SB_ANON, Authorization: 'Bearer ' + SB_ANON, 'Content-Type': file.type },
    body: file
  });
  if (!r.ok) throw new Error('Upload failed ' + r.status + ': ' + (await r.text()));
  return SB_URL + '/storage/v1/object/public/' + bucket + '/' + name;
}

// Utils
function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#x27;').replace(/"/g,'&quot;');
}
function money(n) { return (Number(n)||0).toLocaleString('fr-DZ'); }
function compact(n) { n=Number(n)||0; if(n>=1e6) return (n/1e6).toFixed(1)+'M'; if(n>=1e3) return (n/1e3).toFixed(n%1e3?1:0)+'K'; return String(n); }
function toast(msg, dur) {
  dur = dur || 3000;
  var t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._t); t._t = setTimeout(function(){ t.style.display='none'; }, dur);
}


var prod=null, qty=1, selCI=0, imgs=[], eurRate=270;

function applyLang(){
  var fr=LANG==='fr';
  document.documentElement.setAttribute('dir',fr?'ltr':'rtl');
  document.documentElement.setAttribute('lang',LANG);
  document.getElementById('clrLbl').childNodes[0].textContent=fr?'🎨 Couleur: ':'🎨 اللون: ';
  document.getElementById('qtyLbl').textContent=fr?'Quantité':'الكمية';
  document.getElementById('priceLabel').textContent=fr?'Prix':'السعر';
  document.getElementById('totalLabel').textContent=fr?'Total':'المجموع';
  document.getElementById('orderBtn').textContent=fr?'🛒 Commander':'🛒 إتمام الطلب';
  document.getElementById('tr1').textContent=fr?'Roses fraîches':'ورد طازج';
  document.getElementById('tr2').textContent=fr?'Emballage luxe':'تغليف فاخر';
  document.getElementById('tr3').textContent=fr?'Livraison rapide':'توصيل سريع';
  document.getElementById('tr4').textContent=fr?'Paiement sécurisé':'دفع آمن';
}

function chQty(d){ qty=Math.max(1,Math.min(20,qty+d)); document.getElementById('qNum').textContent=qty; updateTotals(); }

function updateTotals(){
  if(!prod) return;
  var p=Number(prod.price)||0;
  document.getElementById('tPrice').textContent=money(p)+' دج';
  document.getElementById('tTotal').textContent=money(p*qty)+' دج';
}

function setMainImg(src){
  var m=document.getElementById('galMain');
  if(src){
    m.innerHTML='<img src="'+src+'" onerror="this.parentElement.innerHTML=\'<div class=\\\"emo\\\">🌹</div>\'">';
  } else {
    m.innerHTML='<div class="emo">'+(prod&&prod.emoji||'🌹')+'</div>';
  }
}

var curImgIdx=0;

function buildGallery(imgList){
  imgs=imgList;curImgIdx=0;
  var thumbs=document.getElementById('galThumbs');
  if(!imgs.length){ setMainImg(''); thumbs.innerHTML=''; return; }
  setMainImg(imgs[0]);
  // ✅ DOM API — لا onclick string
  thumbs.innerHTML='';
  for(var i=0;i<imgs.length;i++){
    (function(idx){
      var div=document.createElement('div');
      div.className='gth'+(idx===0?' active':'');
      var im=document.createElement('img');im.src=imgs[idx];im.loading='lazy';
      div.appendChild(im);
      div.addEventListener('click',function(){switchImg(idx);});
      thumbs.appendChild(div);
    })(i);
  }
  // Swipe support
  var gal=document.getElementById('galMain');
  var tx=0;
  gal.addEventListener('touchstart',function(e){tx=e.changedTouches[0].clientX;},{passive:true});
  gal.addEventListener('touchend',function(e){
    var dx=e.changedTouches[0].clientX-tx;
    if(Math.abs(dx)>40){switchImg(dx<0?Math.min(curImgIdx+1,imgs.length-1):Math.max(curImgIdx-1,0));}
  },{passive:true});
  // ✅ Keyboard navigation
  document.addEventListener('keydown',function(e){
    if(!imgs.length)return;
    if(e.key==='ArrowLeft'||e.key==='ArrowRight'){
      var next=e.key==='ArrowLeft'?Math.max(curImgIdx-1,0):Math.min(curImgIdx+1,imgs.length-1);
      switchImg(next);
    }
  });
}

function switchImg(i){
  curImgIdx=i;
  setMainImg(imgs[i]);
  document.querySelectorAll('.gth').forEach(function(d,idx){ d.classList.toggle('active',idx===i); });
  // Scroll thumb into view
  var thumbs=document.getElementById('galThumbs');
  var th=thumbs.children[i];
  if(th) th.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
}

function selColor(i){
  selCI=i;
  document.querySelectorAll('.clr-dot').forEach(function(d,idx){ d.classList.toggle('sel',idx===i); });
  var names=(LANG==='fr'&&prod.color_names_fr&&prod.color_names_fr.length)?prod.color_names_fr:prod.color_names_ar;
  document.getElementById('selClrName').textContent=(names&&names[i])||'';
}

function goProduct(id){location.href='product.html?id='+id;}
function openZoom(){
  var src=imgs&&imgs.length?imgs[curImgIdx]:'';
  if(!src)return;
  document.getElementById('zoomImg').src=src;
  document.getElementById('zoomOv').classList.add('sh');
}

function shareProduct(){
  var name=prod?(prod.name_ar||prod.name||''):'';
  var url=location.href;
  if(navigator.share){navigator.share({title:'Fleurs by Liza — '+name,url:url});return;}
  navigator.clipboard.writeText(url).then(function(){toast('✅ تم نسخ الرابط');});
}
function shareWA(){var name=prod?(prod.name_ar||prod.name||''):'';window.open('https://wa.me/?text='+encodeURIComponent('🌹 '+name+' — Fleurs by Liza\n'+location.href));}
function shareFB(){window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href));}

function saveRecent(p){
  try{
    var rv=JSON.parse(localStorage.getItem('fl_rv')||'[]');
    rv=rv.filter(function(x){return x.id!==p.id;});
    rv.unshift({id:p.id,name:p.name_ar||p.name||'',emoji:p.emoji||'🌹',img:p.media_items&&p.media_items.length?p.media_items[0].src:''});
    rv=rv.slice(0,8);
    localStorage.setItem('fl_rv',JSON.stringify(rv));
  }catch(e){}
}

function loadRecent(currentId){
  try{
    var rv=JSON.parse(localStorage.getItem('fl_rv')||'[]').filter(function(x){return x.id!==currentId;});
    if(!rv.length)return;
    var sec=document.getElementById('rvSection');sec.style.display='block';
    var g=document.getElementById('rvGrid');
    g.innerHTML='';
    rv.slice(0,5).forEach(function(p){
      var d=document.createElement('div');
      d.className='rv-card';
      d.onclick=function(){location.href='product.html?id='+encodeURIComponent(p.id);};
      var inner='';
      if(p.img) inner='<img src="'+p.img+'" loading="lazy">';
      else inner='<div class="rv-emo">'+p.emoji+'</div>';
      inner+='<div class="rv-name">'+esc(p.name)+'</div>';
      d.innerHTML=inner;
      g.appendChild(d);
    });
  }catch(e){}
}

function socialProof(){
  var n=Math.floor(Math.random()*8)+2;
  var d=document.querySelector('.total-box');
  if(!d)return;
  var sp=document.createElement('div');
  sp.className='social-proof';
  sp.innerHTML='🔥 طلبت <b>'+n+' أشخاص</b> هذا المنتج اليوم';
  d.parentNode.insertBefore(sp,d);
}

function goCheckout(){
  if(!prod){ toast('⏳'); return; }
  var names=(LANG==='fr'&&prod.color_names_fr&&prod.color_names_fr.length)?prod.color_names_fr:prod.color_names_ar;
  var clr=(names&&names[selCI])||'';
  location.href='checkout.html?id='+encodeURIComponent(prod.id)+'&qty='+qty+'&color='+encodeURIComponent(clr)+'&lang='+LANG;
}

async function loadProd(){
  applyLang();
  var id=new URLSearchParams(location.search).get('id');
  var lang=new URLSearchParams(location.search).get('lang');
  if(lang) LANG=lang;
  if(!id){ document.getElementById('pName').textContent='Produit introuvable'; document.getElementById('ld').classList.add('h'); return; }
  try{
    var rows=await sbGet('products','?id=eq.'+encodeURIComponent(id)+'&limit=1');
    if(!rows||!rows.length){ document.getElementById('pName').textContent='Produit non disponible'; document.getElementById('ld').classList.add('h'); return; }
    prod=rows[0];
    var name=LANG==='fr'&&prod.name_fr?prod.name_fr:(prod.name_ar||prod.name||'');
    var desc=LANG==='fr'&&prod.description_fr?prod.description_fr:(prod.description_ar||prod.description||'');
    document.getElementById('pName').textContent=name;
    document.getElementById('pDesc').textContent=desc;
    document.title=name+' — Fleurs by Liza';
    // ✅ SEO dinamique من الأدمن
    try{
      var seo=await getSetting('seo');
      if(seo&&seo.prod_title)document.title=seo.prod_title.replace('{name}',name);
      var metaDesc=document.querySelector('meta[name="description"]');
      if(metaDesc&&seo&&seo.prod_desc)metaDesc.content=seo.prod_desc.replace('{name}',name).replace('{price}',money(Number(prod.price)||0));
    }catch(e){}
    var bn=document.getElementById('breadName');
    if(bn&&name){bn.textContent=name;bn.style.display='inline';var bs=document.getElementById('breadSep');if(bs)bs.style.display='inline';}
    var price=Number(prod.price)||0, old=Number(prod.old_price)||0;
    document.getElementById('pPrice').textContent=money(price)+' دج';
    if(old>price){ document.getElementById('pOld').textContent=money(old)+' دج'; }
    updateTotals();
    // gallery
    var imgArr=[];
    if(prod.media_items&&prod.media_items.length){
      prod.media_items.forEach(function(m){ if(m&&m.type==='image'&&m.src) imgArr.push(m.src); });
    }
    buildGallery(imgArr);
    if(old>price) document.getElementById('gal').insertAdjacentHTML('beforeend','<div class="gal-badge">PROMO</div>');
    // colors
    var colors=prod.colors||[];
    if(colors.length){
      document.getElementById('clrBlock').style.display='block';
      var clrOpts=document.getElementById('clrOpts');clrOpts.innerHTML='';
      for(var i=0;i<colors.length;i++){
        (function(idx){
          var div=document.createElement('div');
          div.className='clr-dot'+(idx===0?' sel':'');
          div.style.background=colors[idx];
          div.addEventListener('click',function(){selColor(idx);});
          clrOpts.appendChild(div);
        })(i);
      }
      selColor(0);
    }
    saveRecent(prod);
    loadRecent(prod.id);
    setTimeout(socialProof, 1500);
    document.getElementById('ld').classList.add('h');
    // EUR
    try{
      var er=Number(sessionStorage.getItem('fl_eur'))||270;
      document.getElementById('pEur').textContent='≈ '+(price/er).toFixed(0)+' €';
    }catch(e){}
  }catch(e){
    document.getElementById('pName').textContent='Erreur: '+e.message;
    document.getElementById('ld').classList.add('h');
  }
}
loadProd();
</script>
</body></html>
